<form action="https://formsubmit.co/contact@thewalkingweb.net" method="POST">

    <input type="hidden" name="_subject" value="New Consultation Booking - The Walking Web LLC">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://areyhya.github.io/TheWalkingWebLLC/contact.html?success=true">

    <div class="form-group">
        <label for="name">Name *</label>
        <input type="text" id="name" name="Name" required placeholder="Enter your full name">
    </div>

    <div class="form-group">
        <label for="company">Company *</label>
        <input type="text" id="company" name="Company" required placeholder="Enter your business name">
    </div>

    <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="Email" required placeholder="name@yourbusiness.com">
    </div>

    <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="Phone" required placeholder="(555) 000-0000">
    </div>

    <div class="form-group">
        <label for="service">Type of Service *</label>
        <select id="service" name="Service_Type" required>
            <option value="" disabled selected>-- Select a Service --</option>
            <option value="Website Design">Website Design</option>
            <option value="Marketing Insights & Social Media">Marketing Insights & Social Media</option>
            <option value="AI Business Efficiency Audit">AI Business Efficiency Audit</option>
            <option value="Small Business Digital Presence Audit">Small Business Digital Presence Audit</option>
            <option value="Grant + Funding Readiness">Grant + Funding Readiness</option>
            <option value="SOP & Knowledge Base Creation">SOP & Knowledge Base Creation</option>
            <option value="Customer Experience (CX) Audit">Customer Experience (CX) Audit</option>
            <option value="Reputation & Review Management">Reputation & Review Management</option>
        </select>
    </div>

    <div class="form-group">
        <label for="callback-time">Preferred Callback Time *</label>
        <select id="callback-time" name="Preferred_Callback_Time" required>
            <option value="" disabled selected>-- Select Preferred Time Window --</option>
            <option value="Morning (9:00 AM - 12:00 PM)">Morning (9:00 AM - 12:00 PM)</option>
            <option value="Afternoon (12:00 PM - 4:00 PM)">Afternoon (12:00 PM - 4:00 PM)</option>
            <option value="Evening (4:00 PM - 7:00 PM)">Evening (4:00 PM - 7:00 PM)</option>
            <option value="As Soon As Possible">As Soon As Possible</option>
        </select>
    </div>

    <div style="margin-top: 2rem; text-align: center;">
        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; font-size: 1rem; padding: 1rem;">
            Submit Booking
        </button>
    </div>

</form>
